apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
spec:
  selector:
    matchLabels:
      app: rest
  replicas: 1
  template:
    metadata:
      labels:
        app: rest
    spec:
      containers:
      - name: rest
        image: jotr5402/jotr5402:lab7-rest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_SERVICE_PORT
          value: "6379"
        - name: RUSTFS_ENDPOINT
          value: "http://rustfs-svc.rustfs-ns.svc.cluster.local:9000"
        - name: RUSTFS_QUEUE
          value: "queue"
        - name: RUSTFS_TRACK
          value: "track"
---
